name: iOS Deep Compiler Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-ios-framework:
    name: Flutter iOS Diagnostic Check
    runs-on: macos-15

    steps:
      # 1. Bring the repository files into the runner workspace first
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up the Flutter environment
      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Fetch Flutter/Dart dependencies (creates internal iOS symlinks)
      - name: Resolve Flutter Dependencies
        run: flutter pub get

      # 4. Inject Bundle Identifier (Now that project.pbxproj exists)
      - name: Auto-Inject Bundle Identifier
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.filosign.app;/g' ios/Runner.xcodeproj/project.pbxproj || true

      # 5. Install CocoaPods dependencies (Now that the ios folder exists)
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      # 6. Execute the compilation test
      - name: Run Platform Compilation Test
        run: |
          flutter build ios --release --no-codesign -v
