name: iOS Deep Compiler Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-ios-framework:
    name: Flutter iOS Diagnostic Check
    runs-on: macos-15

    steps:
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Auto-Inject Bundle Identifier
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.filosign.app;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Run Platform Compilation Test
        run: |
          flutter build ios --release --no-codesign -v
